<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      background: {{bg_color:color:Warna Background:#1a1a2e}};
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ui-sans-serif, system-ui, sans-serif;
      overflow: hidden;
    }
    .container {
      text-align: center;
      padding: 60px;
      max-width: 900px;
    }
    .label {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: {{accent_color:color:Warna Aksen:#e63946}};
      margin-bottom: 20px;
    }
    h1 {
      font-size: 4rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 1.5rem;
      color: rgba(255,255,255,0.65);
      line-height: 1.5;
      margin-bottom: 40px;
    }
    .cta {
      display: inline-block;
      padding: 16px 48px;
      background: {{accent_color:color:Warna Aksen:#e63946}};
      color: white;
      font-size: 1.125rem;
      font-weight: 700;
      border-radius: 100px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="label">{{label:text:Label Atas:Penawaran Terbatas}}</p>
    <h1>{{judul:text:Judul Utama:Diskon Spesial 50%}}</h1>
    <p>{{deskripsi:textarea:Deskripsi:Dapatkan penawaran terbaik untuk semua produk pilihan kami.}}</p>
    <div class="cta">{{cta_text:text:Teks Tombol:Beli Sekarang}}</div>
  </div>
</body>
</html>
