<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: {{bg_color:color:Warna Background:#0f172a}};
      display: flex; align-items: center; justify-content: center;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    .layout {
      display: flex; align-items: center; gap: 80px;
      padding: 60px; max-width: 1200px; width: 100%;
    }
    .img-wrap {
      flex-shrink: 0; width: 420px; height: 320px;
      border-radius: 16px; overflow: hidden;
      background: #1e293b;
    }
    .img-wrap img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .content { flex: 1; }
    .tag {
      display: inline-block;
      padding: 4px 12px; border-radius: 100px;
      background: {{accent_color:color:Warna Aksen:#6366f1}};
      color: #fff; font-size: 0.85rem; font-weight: 600;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 3rem; font-weight: 800; color: #fff;
      line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 16px;
    }
    p {
      font-size: 1.125rem; color: rgba(255,255,255,0.6);
      line-height: 1.6; margin-bottom: 32px;
    }
    .price {
      font-size: 2.5rem; font-weight: 800;
      color: {{accent_color:color:Warna Aksen:#6366f1}};
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="img-wrap">
      <img src="{{gambar:image:Foto Produk}}" alt="produk">
    </div>
    <div class="content">
      <span class="tag">{{tag:text:Tag Kategori:Produk Unggulan}}</span>
      <h1>{{nama_produk:text:Nama Produk:Nama Produk Anda}}</h1>
      <p>{{deskripsi:textarea:Deskripsi Produk:Deskripsi singkat tentang produk ini.}}</p>
      <div class="price">{{harga:text:Harga:Rp 0}}</div>
    </div>
  </div>
</body>
</html>
